name: Update RapidRAW cask

on:
  schedule:
    # GitHub cron is UTC-only. 04:00 UTC is 05:00 in Europe/Copenhagen during
    # winter time (CET) and 06:00 during summer time (CEST), so this drifts
    # by one hour with daylight saving.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rapidraw
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/CyberTimon/RapidRAW/releases/latest --jq .tag_name)"
          latest="${tag#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/rapidraw.rb)"
          if [ -z "$latest" ] || [ -z "$current" ]; then
            echo "Could not determine versions (latest='$latest', current='$current')" >&2
            exit 1
          fi
          echo "Latest: $latest, current: $current"
          if [ "$latest" = "$current" ]; then
            echo "Cask is already up to date."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Update cask
        if: steps.check.outputs.update == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          base="https://github.com/CyberTimon/RapidRAW/releases/download/v${LATEST}"
          arm_token="$(sed -n 's/^  arch arm: "\([^"]*\)".*/\1/p' Casks/rapidraw.rb)"
          intel_token="$(sed -n 's/^  arch .*intel: "\([^"]*\)".*/\1/p' Casks/rapidraw.rb)"
          [ -n "$arm_token" ] && [ -n "$intel_token" ] || { echo "Could not read arch tokens" >&2; exit 1; }

          curl -fsSL -o arm.dmg "${base}/02_RapidRAW_v${LATEST}_${arm_token}.dmg"
          curl -fsSL -o intel.dmg "${base}/02_RapidRAW_v${LATEST}_${intel_token}.dmg"
          arm_sha="$(sha256sum arm.dmg | cut -d' ' -f1)"
          intel_sha="$(sha256sum intel.dmg | cut -d' ' -f1)"
          rm -f arm.dmg intel.dmg

          sed -i \
            -e "s/^  version \".*\"$/  version \"${LATEST}\"/" \
            -e "s/^  sha256 arm:   \"[0-9a-f]*\",$/  sha256 arm:   \"${arm_sha}\",/" \
            -e "s/^         intel: \"[0-9a-f]*\"$/         intel: \"${intel_sha}\"/" \
            Casks/rapidraw.rb

          grep -qF "  version \"${LATEST}\"" Casks/rapidraw.rb
          grep -qF "\"${arm_sha}\"" Casks/rapidraw.rb
          grep -qF "\"${intel_sha}\"" Casks/rapidraw.rb
          git diff --stat

      - name: Commit and push
        if: steps.check.outputs.update == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rapidraw.rb
          git commit -m "rapidraw ${LATEST}"
          git push
