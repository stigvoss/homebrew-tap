name: Bump rapidraw cask on schedule or request

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Casks to bump (defaults to rapidraw)
        required: false
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  autobump:
    environment: github_actions
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.12.1
        with:
          cask: false
          core: false

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@2026.10.12.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'github-actions[bot]' }}

      - name: Bump rapidraw
        uses: Homebrew/actions/bump-packages@2026.10.12.1
        continue-on-error: true
        with:
          token: ${{ secrets.AUTOBUMP_TOKEN }}
          casks: ${{ github.event.inputs.casks || 'rapidraw' }}
